name: ci
on: [push, pull_request, schedule]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: github/codeql-action/analyze@v3
