name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The Regulation is corrected after publication. A weekly run asks the
    # Official Journal whether a corrigendum appeared that this repository has
    # not applied; rebuilding from the local copy could never see one.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20.11', '22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Run what a user runs, so the published script is the tested one.
      - run: npm test

  reference-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: The shipped Regulation matches its recorded digests
        run: cd reference && shasum -a 256 -c SHA256SUMS
      - name: The locus index is reproducible from the shipped text
        run: |
          node scripts/build-reference.mjs
          git diff --exit-code reference/
      - name: docs/coverage.md is generated, not hand-edited
        run: |
          node scripts/generate-coverage-doc.mjs
          git diff --exit-code docs/coverage.md

  upstream-currency:
    # The only check here that can fail because the law moved rather than
    # because the code did. Exit 2 means the sources were unreachable, which is
    # not a clean bill of health, so it is reported as a failure too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: The shipped Regulation is still the Regulation in force
        run: node scripts/check-upstream.mjs

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Produce this repository's own evidence pack
        run: node bin/probative.mjs run . --out cra-evidence/ --force
      - name: Verify it
        run: node bin/probative.mjs verify cra-evidence/ --against .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cra-evidence-pack
          path: cra-evidence/
