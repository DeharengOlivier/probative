       stars whose centres lie on a circle of radius hoist/3, each circumscribed
       by a circle of radius hoist/18, each with one point vertically upward.
       Never redraw, recolour, rotate or stretch it. See assets/README.md for
       the conditions this project accepts in using it. -->
